<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد فحص | مركز المختص الفاحص</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #ffffff; color: #1e293b; }
        .red-text { color: #dc2626; }
        .red-bg { background-color: #dc2626; color: #ffffff; }
        .red-bg:hover { background-color: #b91c1c; }
        .card-white {
            background: #ffffff;
            border: 2px solid #dc2626;
            box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="card-white border-b-2 border-red-600 py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl red-bg flex items-center justify-center font-black text-xl shadow-md">
                    <i class="fa-solid fa-car-shield"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-gray-900">حجز موعد فحص</h1>
                    <p class="text-xs text-gray-500">مركز المختص الفاحص</p>
                </div>
            </div>
            <a href="index.html" class="text-xs text-gray-900 hover:text-red-600 transition border-2 border-red-600 bg-red-50 px-3.5 py-2 rounded-xl flex items-center gap-1 font-bold shadow-sm">
                <i class="fa-solid fa-house ml-1"></i> الرئيسية
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="card-white p-6 md:p-8 rounded-3xl space-y-6">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-900">حجز موعد فحص جديد</h2>
                <p class="text-xs text-gray-500 mt-1">اختر الباقة، الموعد، واليوم المناسب لك بكل سهولة</p>
            </div>

            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-700 mb-1 font-semibold">سجل اسمك</label>
                    <input type="text" id="bName" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600" placeholder="الاسم الكريم">
                </div>
                <div>
                    <label class="block text-xs text-gray-700 mb-1 font-semibold">سجل رقمك (الجوال)</label>
                    <input type="text" id="bPhone" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600" placeholder="05xxxxxxxx">
                </div>
                <div>
                    <label class="block text-xs text-gray-700 mb-1 font-semibold">نوع المركبة</label>
                    <input type="text" id="bCar" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600" placeholder="مثال: تويوتا كامري 2024">
                </div>
                <div>
                    <label class="block text-xs text-gray-700 mb-1 font-semibold">نوع الفحص (الباقة)</label>
                    <!-- تم ربط هذه القائمة لتجلب الباقات المضافة من لوحة التحكم تلقائياً -->
                    <select id="bPackage" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600">
                        <!-- تعبئة ديناميكية -->
                    </select>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-700 mb-1 font-semibold">حدد يوم الموعد</label>
                        <input type="date" id="bDate" required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-700 mb-1 font-semibold">الساعة كام حاب يكون موعدك؟</label>
                        <select id="bTime" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-red-600">
                            <option value="09:00 ص - 09:30 ص">من 9:00 إلى 9:30 صباحاً</option>
                            <option value="09:30 ص - 10:00 ص">من 9:30 إلى 10:00 صباحاً</option>
                            <option value="10:00 ص - 10:30 ص">من 10:00 إلى 10:30 صباحاً</option>
                            <option value="10:30 ص - 11:00 ص">من 10:30 إلى 11:00 صباحاً</option>
                            <option value="04:00 م - 04:30 م">من 4:00 إلى 4:30 عصراً</option>
                            <option value="04:30 م - 05:00 م">من 4:30 إلى 5:00 عصراً</option>
                            <option value="05:00 م - 05:30 م">من 5:00 إلى 5:30 عصراً</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full red-bg font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-600/20">تأكيد الموعد والإرسال للواتساب</button>
            </form>

            <div id="bookingResultBox" class="hidden mt-6 p-4 bg-gray-50 border border-red-300 rounded-2xl text-center space-y-3">
                <p class="text-xs text-gray-700 font-semibold">تم إنشاء رابط خاص لموعدك بنجاح:</p>
                <div class="flex gap-2">
                    <input type="text" id="bookingLinkInput" readonly class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-xs text-red-600 font-mono">
                    <button onclick="copyBookingLink()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-xs transition whitespace-nowrap">نسخ الرابط</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-100 border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        <p>جميع الحقوق محفوظة © 2026 - مركز المختص الفاحص</p>
    </footer>

    <script>
        // دالة لجلب الباقات المحفوظة وعرضها في قائمة اختيار الحجز
        function loadBookingPackages() {
            let select = document.getElementById('bPackage');
            let packages = JSON.parse(localStorage.getItem('center_packages')) || [
                { title: 'فحص شامل (محرك + قير + شاصي + بودي)', price: '450 ر.س' },
                { title: 'فحص الكمبيوتر والأجهزة الإلكترونية', price: '250 ر.س' },
                { title: 'فحص البدي والهيكل الخارجي', price: '200 ر.س' }
            ];
            select.innerHTML = '';
            packages.forEach(pkg => {
                select.innerHTML += `<option value="${pkg.title} (${pkg.price})">${pkg.title} - ${pkg.price}</option>`;
            });
        }

        window.onload = function() {
            loadBookingPackages();
        };

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let name = document.getElementById('bName').value;
            let phone = document.getElementById('bPhone').value;
            let car = document.getElementById('bCar').value;
            let pkg = document.getElementById('bPackage').value;
            let date = document.getElementById('bDate').value;
            let time = document.getElementById('bTime').value;

            let bookingCode = "BK-" + Math.floor(1000 + Math.random() * 9000);
            
            let bookings = JSON.parse(localStorage.getItem('center_bookings')) || [];
            bookings.push({ code: bookingCode, name, phone, car, pkg, date, time });
            localStorage.setItem('center_bookings', JSON.stringify(bookings));

            let currentUrl = window.location.href.split('?')[0];
            let bookingUrl = `${currentUrl}?booking=${bookingCode}`;
            document.getElementById('bookingLinkInput').value = bookingUrl;
            document.getElementById('bookingResultBox').style.display = 'block';

            let msg = `السلام عليكم، تم حجز موعد جديد:%0a- الرمز: ${bookingCode}%0a- الاسم: ${name}%0a- الجوال: ${phone}%0a- السيارة: ${car}%0a- الباقة: ${pkg}%0a- التاريخ: ${date}%0a- الوقت: ${time}`;
            window.open(`https://wa.me/966599878570?text=${msg}`, '_blank');
        });

        function copyBookingLink() {
            let copyText = document.getElementById('bookingLinkInput');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('تم نسخ رابط الموعد بنجاح!');
        }
    </script>
</body>
</html>
